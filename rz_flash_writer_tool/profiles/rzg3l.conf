# RZ/G3L platform verification profile
#
# Shared by boards using the RZ/G3L Flash Writer protocol output.
# Derived from the RZ/G3L Linux Start-up Guide Rev.1.00-rc1 sections 4.3,
# 4.4, and 8.2.1. ORER is a fatal SCIF receive-overrun indication.
#
# Default assignments preserve explicit overrides from the board config.

: "${VERIFY_DOWNLOAD_PATTERN:=-- Load Program to (SRAM|SystemRAM)[[:space:]]+-+}"
: "${VERIFY_FW_PATTERN:=Flash writer for RZ/G3L Series}"
: "${VERIFY_SPI_BL2_PATTERN:=SpiFlashMemory[[:space:]]+End Address[[:space:]]*:}"
: "${VERIFY_SPI_FIP_PATTERN:=SpiFlashMemory[[:space:]]+End Address[[:space:]]*:}"
: "${VERIFY_EMMC_BL2_PATTERN:=EM_W Complete!}"
: "${VERIFY_EMMC_FIP_PATTERN:=EM_W Complete!}"
: "${VERIFY_EMMC_CONFIG_B1_PATTERN:=EXT_CSD\[B1\][[:space:]]*=[[:space:]]*0x02}"
: "${VERIFY_EMMC_CONFIG_B1_RESULT_PATTERN:=EXT_CSD\[B1\][[:space:]]*=[[:space:]]*0x[[:xdigit:]]+}"
: "${VERIFY_EMMC_CONFIG_PATTERN:=EXT_CSD\[B3\][[:space:]]*=[[:space:]]*0x08}"
: "${VERIFY_EMMC_CONFIG_RESULT_PATTERN:=EXT_CSD\[B3\][[:space:]]*=[[:space:]]*0x[[:xdigit:]]+}"
: "${VERIFY_ERASE_PATTERN:=EM_E Complete!}"
: "${VERIFY_ERROR_PATTERN:=ORER}"
