# RZ/V2N platform verification profile
#
# Shared by rzv2n-evk, bananapi-ai2n, and other RZ/V2N boards using the same
# Flash Writer protocol output.
#
# Derived from a successful RZ/V2N Flash Writer V0.90 SPI programming log and
# the confirmed shared RZ/V2H/RZ/V2N eMMC programming, boot setup, and erase
# protocol. Failure patterns intentionally remain undefined until representative
# failure logs are available.
#
# Default assignments preserve explicit overrides from the board config.

: "${VERIFY_DOWNLOAD_PATTERN:=SCI Download mode \(Normal SCI boot\)}"
: "${VERIFY_FW_PATTERN:=Flash writer for RZ/V2N Series}"
: "${VERIFY_SPI_BL2_PATTERN:=SpiFlashMemory End Address[[:space:]]*:}"
: "${VERIFY_SPI_FIP_PATTERN:=SpiFlashMemory End Address[[:space:]]*:}"
: "${VERIFY_EMMC_BL2_PATTERN:=EM_W Complete!}"
: "${VERIFY_EMMC_FIP_PATTERN:=EM_W Complete!}"
: "${VERIFY_EMMC_CONFIG_B1_PATTERN:=EXT_CSD\[B1\][[:space:]]*=[[:space:]]*0x02}"
: "${VERIFY_EMMC_CONFIG_B1_RESULT_PATTERN:=EXT_CSD\[B1\][[:space:]]*=[[:space:]]*0x[[:xdigit:]]+}"
: "${VERIFY_EMMC_CONFIG_PATTERN:=EXT_CSD\[B3\][[:space:]]*=[[:space:]]*0x08}"
: "${VERIFY_EMMC_CONFIG_RESULT_PATTERN:=EXT_CSD\[B3\][[:space:]]*=[[:space:]]*0x[[:xdigit:]]+}"
: "${VERIFY_ERASE_PATTERN:=EM_E Complete!}"
